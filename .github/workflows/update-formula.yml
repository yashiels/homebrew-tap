name: Update Formula
run-name: Update ${{ inputs.formula }} for ${{ inputs.tag }}${{ inputs.request_id && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula name (e.g., lnk)"
        required: true
        type: string
      tag:
        description: "Release tag to update formula for"
        required: true
        type: string
      repository:
        description: "Source repository (e.g., yashiels/linkedin-cli)"
        required: true
        type: string
      description:
        description: "Formula description used when creating a missing formula"
        required: false
        type: string
      macos_artifact:
        description: "macOS artifact name"
        required: false
        type: string
      linux_url:
        description: "Linux archive URL"
        required: false
        type: string
      artifact_template:
        description: "Multi-arch asset template, e.g. {formula}_{version}_{target}.tar.gz"
        required: false
        type: string
      artifact_url:
        description: "Direct artifact/source URL template"
        required: false
        type: string
      target_aliases:
        description: "Comma-separated canonical=artifact-target aliases"
        required: false
        type: string
      cask:
        description: "Optional cask name to update"
        required: false
        type: string
      cask_artifact:
        description: "Release asset name for the optional cask"
        required: false
        type: string
      request_id:
        description: "Unique caller-generated ID"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v6

      - name: Update formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            --formula "${{ inputs.formula }}"
            --tag "${{ inputs.tag }}"
            --repository "${{ inputs.repository }}"
          )
          if [ -n "${{ inputs.description }}" ]; then args+=(--description "${{ inputs.description }}"); fi
          if [ -n "${{ inputs.macos_artifact }}" ]; then args+=(--macos-artifact "${{ inputs.macos_artifact }}"); fi
          if [ -n "${{ inputs.linux_url }}" ]; then args+=(--linux-url "${{ inputs.linux_url }}"); fi
          if [ -n "${{ inputs.artifact_template }}" ]; then args+=(--artifact-template "${{ inputs.artifact_template }}"); fi
          if [ -n "${{ inputs.artifact_url }}" ]; then args+=(--artifact-url "${{ inputs.artifact_url }}"); fi
          if [ -n "${{ inputs.target_aliases }}" ]; then args+=(--target-aliases "${{ inputs.target_aliases }}"); fi
          if [ -n "${{ inputs.cask }}" ]; then args+=(--cask "${{ inputs.cask }}"); fi
          if [ -n "${{ inputs.cask_artifact }}" ]; then args+=(--cask-artifact "${{ inputs.cask_artifact }}"); fi
          python3 .github/scripts/update_formula.py "${args[@]}"

      - name: Commit formula via signed API
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          FORMULA="${{ inputs.formula }}"
          TAG="${{ inputs.tag }}"
          CASK="${{ inputs.cask }}"
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF_NAME}"

          paths=("Formula/${FORMULA}.rb")
          [ -n "$CASK" ] && paths+=("Casks/${CASK}.rb")

          additions='[]'
          changed=0
          for p in "${paths[@]}"; do
            if [ -f "$p" ] && [ -n "$(git status --porcelain -- "$p")" ]; then
              changed=1
              c=$(base64 < "$p" | tr -d '\n')
              additions=$(jq -n --argjson a "$additions" --arg p "$p" --arg c "$c" '$a + [{path: $p, contents: $c}]')
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "Formula/${FORMULA}.rb already up to date"
            exit 0
          fi

          msg="${FORMULA}: update formula for ${TAG}"
          [ -n "$CASK" ] && msg="${FORMULA}: update formula and cask for ${TAG}"

          for attempt in 1 2 3 4 5; do
            oid=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')
            payload=$(jq -n \
              --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$oid" \
              --arg headline "$msg" --argjson additions "$additions" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $oid, message: {headline: $headline}, fileChanges: {additions: $additions}}}}')
            if out=$(printf '%s' "$payload" | gh api graphql --input - 2>&1); then
              url=$(printf '%s' "$out" | jq -r '.data.createCommitOnBranch.commit.url // empty')
              if [ -n "$url" ]; then echo "Committed (verified): $url"; exit 0; fi
              echo "attempt $attempt: no commit in response: $out"
            else
              echo "attempt $attempt failed: $out"
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to create signed commit after retries" >&2
          exit 1
